name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            deno: v2.x
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: ${{ matrix.deno }}
      - run: deno task lint
      - run: deno task fmt
  test:
    needs: [check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            deno: v2.x
          - os: ubuntu-latest
            deno: canary
          - os: windows-latest
            deno: v2.x
          - os: macos-latest
            deno: v2.x
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: ${{ matrix.deno }}
      - run: deno task test
